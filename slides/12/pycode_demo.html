<style>

  html, body { height:100%; }
  body { margin:0; padding:12px 16px; font-family:"Source Serif 4", Georgia, serif; color:var(--text); background:#fff; box-sizing:border-box; display:flex; flex-direction:column; }

  @media (max-width:640px) { .work { grid-template-columns:1fr; } }

<script>
const $ = id => document.getElementById(id);
const editor = CodeMirror.fromTextArea($('code'), {
  mode: 'python', lineNumbers: true, lineWrapping: true, indentUnit: 4, matchBrackets: true,
  extraKeys: { 'Shift-Enter': () => run(), Tab: cm => cm.replaceSelection('    ') },
});

function status(text, cls) { $('status').textContent = text; $('status').className = cls; }
function append(html) { $('output').insertAdjacentHTML('beforeend', html); $('output').scrollTop = $('output').scrollHeight; }
const escape = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);

// loading starts as soon as the deck opens, so Python is ready by the time the slide is shown
// (indexURL must be explicit: once pandoc embeds this page, pyodide.js no longer has a URL to find its files from)
const ready = (async () => {
  const py = await loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/' });
  await py.loadPackage(['numpy', 'pandas', 'scipy', 'matplotlib', 'micropip']);
  // pingouin isn't bundled with Pyodide, so it comes from PyPI; newer versions need a newer pandas than Pyodide has
  await py.runPythonAsync("import micropip\nawait micropip.install(['pingouin==0.5.5', 'seaborn'])");
  py.FS.writeFile('adam_sandler.csv', $('data').textContent.trim() + '\n');
  // plots are collected after each run instead of opening a window
  await py.runPythonAsync(`
import matplotlib
matplotlib.use('agg')
import matplotlib.pyplot as plt
plt.show = lambda *args, **kwargs: None
# Safari: scipy.special.betainc returns nan in WebAssembly, so pearsonr's p-value is nan.
# Recompute it from the t-distribution (same p-value for Pearson's r), only when needed.
import inspect as _inspect
import numpy as _np
import scipy.stats as _ss
import pingouin.correlation as _pgc
_pearsonr = _ss.pearsonr
def _pearsonr_safe(x, y, *args, **kwargs):
    res = _pearsonr(x, y, *args, **kwargs)
    if not _np.isnan(res.pvalue):
        return res
    alt = kwargs.get('alternative', args[0] if args else 'two-sided')
    r, df = float(res.statistic), len(x) - 2
    t = r * _np.sqrt(df / max(1 - r**2, 1e-300))
    p = {'two-sided': 2 * _ss.t.sf(abs(t), df), 'greater': _ss.t.sf(t, df), 'less': _ss.t.cdf(t, df)}[alt]
    return _with_pvalue(res, p)
def _with_pvalue(res, p):
    # results are immutable: rebuild one from its constructor's arguments (stored as .name or ._name),
    # so .statistic, .confidence_interval() etc. still work
    cls = type(res)
    names = [n for n in _inspect.signature(cls.__init__).parameters if n != 'self']
    args = {n: getattr(res, n) if hasattr(res, n) else getattr(res, '_' + n) for n in names}
    args['pvalue'] = p
    return cls(**args)
_ss.pearsonr = _pgc.pearsonr = _pearsonr_safe
# small figure + big fonts, so labels stay readable once the plot is shrunk to fit the pane and the slide
plt.rcParams.update({'figure.figsize': (5, 3.6), 'font.size': 14, 'axes.labelsize': 15, 'svg.fonttype': 'none', 'font.family': 'sans-serif', 'font.sans-serif': ['Helvetica', 'Arial', 'DejaVu Sans']})
import io, base64
import matplotlib.artist
import seaborn as sns
from pyodide.code import eval_code_async

async def _run(src, ns):
    value = await eval_code_async(src, ns, return_mode='last_expr')
    shown = ''
    # a plotting call returns its Axes; the figure below is enough, so don't print the object too
    if isinstance(value, (matplotlib.artist.Artist, sns.axisgrid.Grid)):
        value = None
    if value is not None:
        shown = value._repr_html_() if hasattr(value, '_repr_html_') else '<pre>' + repr(value).replace('&', '&amp;').replace('<', '&lt;') + '</pre>'
    images = []
    for num in plt.get_fignums():
        buf = io.BytesIO()
        # SVG with real <text>, so the browser draws the labels itself instead of relying on matplotlib's font rendering
        plt.figure(num).savefig(buf, format='svg', bbox_inches='tight')
        images.append(base64.b64encode(buf.getvalue()).decode())
    plt.close('all')
    return shown, images
`);
  return py;
})();
ready.then(() => { status('Python ready', 'ready'); $('run').disabled = false; })
  .catch(e => { status('Python failed to load', 'busy'); append(`<pre class="err">${escape(String(e.message).trim().split('\n').pop())}</pre>`); });

let ns = null, running = false;
async function run() {
  if (running) return;
  running = true; $('run').disabled = true; status('Running…', 'busy');
  const py = await ready;
  ns = ns || py.globals.get('dict')();
  append('<div class="run"></div>');
  let text = '';
  py.setStdout({ batched: s => { text += s + '\n'; } });
  py.setStderr({ batched: s => { text += s + '\n'; } });
  try {
    const result = await py.globals.get('_run')(editor.getValue(), ns);
    const [shown, images] = result.toJs();
    result.destroy();
    if (text) append(`<pre>${escape(text)}</pre>`);
    if (shown) append(shown);
    for (const b64 of images) {
      append(`<img alt="Plot" src="data:image/svg+xml;base64,${b64}">`);
      // keep the newest output in view once the plot has its height
      $('output').lastElementChild.onload = () => { $('output').scrollTop = $('output').scrollHeight; };
    }
    status('Python ready', 'ready');
  } catch (e) {
    if (text) append(`<pre>${escape(text)}</pre>`);
    // show only the user's part of the traceback
    const msg = String(e.message).split('\n');
    let start = -1;
    msg.forEach((l, i) => { if (l.includes('File "<exec>"') && !l.includes('in _run')) start = i; });
    append(`<pre class="err">${escape((start >= 0 ? msg.slice(start) : msg).join('\n').trim())}</pre>`);
    status('Error', 'busy');
    py.runPython("plt.close('all')");  // don't carry a half-made plot into the next run
  }
  running = false; $('run').disabled = false;
  editor.focus();
}
$('run').addEventListener('click', run);
$('clear').addEventListener('click', () => { $('output').innerHTML = ''; editor.focus(); });
</script>
