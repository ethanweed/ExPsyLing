<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Least Squares Fit</title>
<style>
  :root { --text:#4c4f69; --mantle:#e6e9ef; --border:#acb0be; --accent:#CD5909; --teal:#4C827B; --blue:#1e66f5; }
  body { margin:0; padding:20px; font-family:"Source Serif 4", Georgia, serif; color:var(--text); background:#fff; box-sizing:border-box; }
  .cols { display:flex; gap:20px; }
  .cols > div:first-child { flex:0 0 32%; }
  .cols > div:last-child { flex:1; min-width:0; }
  .label { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--teal); font-weight:600; margin-bottom:6px; }
  .panel { background:var(--mantle); border:1px solid var(--border); border-radius:8px; padding:14px; }
  .row { display:flex; align-items:center; gap:10px; margin:8px 0; font-size:17px; }
  .row label { width:28px; }
  .row input { flex:1; min-width:0; accent-color:var(--accent); }
  .row span { width:44px; text-align:right; font-variant-numeric:tabular-nums; }
  .eq { margin-top:12px; font-family:"JetBrains Mono","Fira Code",monospace; font-size:15px; }
  .ll { margin-top:14px; font-size:17px; }
  .ll b { font-family:"JetBrains Mono","Fira Code",monospace; font-size:16px; color:var(--accent); }
  .sub { font-family:"JetBrains Mono","Fira Code",monospace; font-size:12px; color:#6c6f85; margin-top:4px; word-break:break-all; }
  .meter { height:12px; background:#fff; border:1px solid var(--border); border-radius:6px; margin-top:8px; overflow:hidden; }
  .meter div { height:100%; background:var(--teal); width:0; transition:width .1s; }
  button { margin-top:14px; margin-right:8px; font:inherit; font-size:16px; padding:6px 14px; border-radius:6px; border:1px solid var(--accent); background:#fff; color:var(--accent); cursor:pointer; }
  button:hover { background:var(--accent); color:#fff; }
  svg { width:100%; height:auto; display:block; }
</style>
</head>
<body>
<div class="cols">
  <div>
    <div class="label">Parameters</div>
    <div class="panel">
      <div class="row"><label>b₀</label><input id="b0" type="range" min="-4" max="10" step="0.05" value="7"><span id="b0v"></span></div>
      <div class="row"><label>b₁</label><input id="b1" type="range" min="-1.5" max="2.5" step="0.01" value="-0.5"><span id="b1v"></span></div>
      <div class="eq">ŷ = <span id="eqv"></span></div>
      <div class="ll">Sum of squared residuals: <b id="ssv"></b></div>
      <div class="sub" id="subv"></div>
      <div class="meter"><div id="bar"></div></div>
    </div>
    <button id="fit">▶ Find best fit</button><button id="new">New data</button>
  </div>
  <div>
    <div class="label">Data</div>
    <svg id="plot" viewBox="0 0 520 360"></svg>
  </div>
</div>
<script>
const N = 15, X0 = 0, X1 = 10, Y0 = 0, Y1 = 14, L = 40, R = 510, B = 320, T = 15;
const sx = v => L + (v - X0) / (X1 - X0) * (R - L);
const sy = v => B - (v - Y0) / (Y1 - Y0) * (B - T);
const randn = () => Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random());

let xs = [], ys = [], best = null, anim = null;
// current parameters (kept separately so slider steps don't snap the fitted values)
let cur = { b0: 7, b1: -0.5 };

function newData() {
  // hidden "true" line
  const a = 1 + Math.random() * 3, b = 0.4 + Math.random() * 0.8;
  xs = Array.from({ length: N }, () => 0.5 + Math.random() * 9);
  ys = xs.map(x => Math.min(Y1 - 0.3, Math.max(Y0 + 0.3, a + b * x + 1.3 * randn())));
  // ordinary least squares: b1 = cov(x, y) / var(x), b0 = ȳ − b1·x̄
  const mx = xs.reduce((s, v) => s + v, 0) / N, my = ys.reduce((s, v) => s + v, 0) / N;
  let sxy = 0, sxx = 0;
  xs.forEach((x, i) => { sxy += (x - mx) * (ys[i] - my); sxx += (x - mx) ** 2; });
  const b1 = sxy / sxx, b0 = my - b1 * mx;
  best = { b0, b1, ss: sse(b0, b1) };
  draw();
}
const sse = (a, b) => xs.reduce((s, x, i) => s + (ys[i] - (a + b * x)) ** 2, 0);

function draw() {
  const a = cur.b0, b = cur.b1, ss = sse(a, b);
  b0.value = a; b1.value = b;
  b0v.textContent = a.toFixed(2); b1v.textContent = b.toFixed(2);
  eqv.textContent = `${a.toFixed(2)} ${b < 0 ? '−' : '+'} ${Math.abs(b).toFixed(2)}·x`;
  ssv.textContent = ss.toFixed(2);
  // show the substitution: first few squared residuals, then the total
  const r = xs.map((x, i) => ys[i] - (a + b * x));
  subv.textContent = 'Σ(y − ŷ)² = ' + r.slice(0, 3).map(v => `${v.toFixed(1)}²`).join(' + ') + ` + … = ${ss.toFixed(2)}`;
  // meter: how close we are to the smallest possible SSR
  bar.style.width = (100 * best.ss / ss) + '%';

  let res = '', pts = '';
  xs.forEach((x, i) => {
    const cx = sx(x), cy = sy(ys[i]), fy = sy(a + b * x);
    res += `<line x1="${cx}" y1="${cy}" x2="${cx}" y2="${fy}" stroke="#CD5909" stroke-opacity="0.7" stroke-width="2"/>`;
    pts += `<circle cx="${cx}" cy="${cy}" r="5" fill="#1e66f5" fill-opacity="0.85"/>`;
  });
  let ticks = '';
  for (let t = 0; t <= 10; t += 2) ticks += `<text x="${sx(t)}" y="${B + 20}" text-anchor="middle" font-size="13" fill="#9ca0b0">${t}</text>`;
  for (let t = 0; t <= 14; t += 2) ticks += `<text x="${L - 8}" y="${sy(t) + 4}" text-anchor="end" font-size="13" fill="#9ca0b0">${t}</text>`;
  plot.innerHTML = `
    <defs><clipPath id="c"><rect x="${L}" y="${T}" width="${R - L}" height="${B - T}"/></clipPath></defs>
    <line x1="${L}" y1="${B}" x2="${R}" y2="${B}" stroke="#acb0be"/>
    <line x1="${L}" y1="${T}" x2="${L}" y2="${B}" stroke="#acb0be"/>
    <g clip-path="url(#c)">
      ${res}
      <line x1="${sx(X0)}" y1="${sy(a + b * X0)}" x2="${sx(X1)}" y2="${sy(a + b * X1)}" stroke="#4C827B" stroke-width="3"/>
    </g>
    ${pts}${ticks}
    <text x="${R}" y="${B + 40}" text-anchor="end" font-size="14" fill="#4C827B">x</text>
    <text x="${L - 30}" y="${T + 4}" font-size="14" fill="#4C827B">y</text>`;
}

function fit() {
  cancelAnimationFrame(anim);
  const a0 = cur.b0, c0 = cur.b1, t0 = performance.now(), dur = 1500;
  const step = now => {
    const t = Math.min(1, (now - t0) / dur), e = t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
    cur.b0 = a0 + (best.b0 - a0) * e;
    cur.b1 = c0 + (best.b1 - c0) * e;
    draw();
    if (t < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}

b0.addEventListener('input', () => { cancelAnimationFrame(anim); cur.b0 = +b0.value; draw(); });
b1.addEventListener('input', () => { cancelAnimationFrame(anim); cur.b1 = +b1.value; draw(); });
document.getElementById('fit').addEventListener('click', fit);
document.getElementById('new').addEventListener('click', () => { cancelAnimationFrame(anim); newData(); });
newData();
</script>
</body>
</html>
