<!-- reveal.js chalkboard plugin (rajgoel/reveal.js-plugins), loaded from CDN at runtime.
     Injected by script (not <script src>) so pandoc's --embed-resources leaves the URLs alone:
     the plugin finds its images/cursors relative to its own URL. Needs internet when presenting.
     Keys: B = blackboard, C = draw on slide, Del = clear, X/Y = next/previous colour, right-drag = erase. -->
<script>
(function () {
  var CB = 'https://cdn.jsdelivr.net/npm/reveal.js-plugins@4.6.0/chalkboard/';
  function css(href) {
    var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = href;
    document.head.appendChild(l);
  }
  css('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css');
  css(CB + 'style.css');
  function start() {
    Reveal.configure({ chalkboard: { boardmarkerWidth: 4, chalkWidth: 5, storage: 'expsyling-chalkboard-' + location.pathname } });
    var s = document.createElement('script');
    s.src = CB + 'plugin.js';
    s.onload = function () { Reveal.registerPlugin(RevealChalkboard); };
    document.body.appendChild(s);
  }
  if (Reveal.isReady()) start(); else Reveal.on('ready', start);
})();
</script>
