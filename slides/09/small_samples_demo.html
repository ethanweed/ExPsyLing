<meta charset="utf-8">

<title>Small samples</title>
<style>
  :root { --text:#4c4f69; --mantle:#e6e9ef; --border:#acb0be; --accent:#CD5909; --blue:#1e66f5; }
  body { margin:0; padding:12px 16px; font-family:"Source Serif 4", Georgia, serif; color:var(--text); background:#fff; box-sizing:border-box; }
  svg.plot { width:100%; height:auto; display:block; }
  .columns { display:flex; gap:20px; }
  .column { flex:1; min-width:0; }
  .panel { background:var(--mantle); border:1px solid var(--border); border-radius:8px; padding:6px 10px; font-size:17px; margin-top:6px; }
  .label { font-size:13px; text-transform:uppercase; letter-spacing:.05em; font-weight:600; margin-bottom:2px; color:var(--blue); }
  .num { font-family:"JetBrains Mono","Fira Code",monospace; font-size:15px; color:var(--blue); }
  .xbar { text-decoration:overline; }
  .buttons { display:flex; gap:8px; margin-top:8px; }
  button { font:inherit; font-size:15px; padding:5px 12px; border-radius:6px; border:1px solid var(--accent); background:#fff; color:var(--accent); cursor:pointer; }
  button:hover { background:var(--accent); color:#fff; }
</style>

<div class="columns" id="columns"></div>
<div class="buttons">
  <button id="draw">▶ Draw</button>
  <button id="reset">Reset</button>
</div>
<script>
const $ = id => document.getElementById(id);
const MU = 100, SIGMA = 15, X0 = 40, X1 = 160, L = 22, R = 428, B = 270, T = 12, PEAK = 50, KEG_W = 44, KEG_H = 43, BIN = 4;
const sx = v => L + (v - X0) / (X1 - X0) * (R - L);
const pdf = x => Math.exp(-0.5 * ((x - MU) / SIGMA) ** 2) / (SIGMA * Math.sqrt(2 * Math.PI));
const sy = d => B - d * (B - PEAK) / pdf(MU);
const randn = () => Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random());

let curve = '';
for (let x = X0; x <= X1; x += 0.5) curve += (curve ? 'L' : 'M') + sx(x).toFixed(1) + ',' + sy(pdf(x)).toFixed(1);
let axis = `<line x1="${L}" y1="${B}" x2="${R}" y2="${B}" stroke="#acb0be"/>`;
for (let v = 40; v <= 160; v += 20) axis += `<text x="${sx(v)}" y="${B + 22}" text-anchor="middle" font-size="14" fill="#9ca0b0">${v}</text>`;

const samples = [100, 3].map((n, i) => {
  $('columns').insertAdjacentHTML('beforeend', `<div class="column">
    <svg class="plot" id="plot${i}" viewBox="0 0 450 300" role="img" aria-label="Population curve with ${n} kegs sampled from it"></svg>
    <div class="panel"><div class="label">Sample (N = ${n})</div><span class="xbar">X</span> = <span class="num" id="xbar${i}">—</span> &nbsp; s = <span class="num" id="sd${i}">—</span></div>
  </div>`);
  return { n, i, values: [] };
});
let anim = null;

function stats(values) {
  const n = values.length, m = values.reduce((a, b) => a + b, 0) / n;
  return { n, m, s: Math.sqrt(values.reduce((a, x) => a + (x - m) ** 2, 0) / (n - 1)) };
}

// each keg stacks on its bin; the step shrinks so a large sample's pile follows the population curve
function layout(p) {
  const counts = new Array(Math.ceil((X1 - X0) / BIN)).fill(0);
  const pos = p.values.map(v => {
    const b = Math.max(0, Math.min(counts.length - 1, Math.floor((v - X0) / BIN)));
    return { x: sx(X0 + (b + 0.5) * BIN), i: counts[b]++ };
  });
  const h = Math.min(KEG_H, (B - PEAK) / (p.n * BIN * pdf(MU)), (B - T - KEG_H) / Math.max(1, Math.max(...counts) - 1));
  return pos.map(k => ({ x: k.x, y: B - KEG_H - k.i * h }));
}

function render(p, t) {
  let out = `<path d="${curve}" fill="none" stroke="#9ca0b0" stroke-width="2" stroke-dasharray="4 4"/>${axis}`;
  // kegs fall from the top, staggered, and pile up on the axis
  layout(p).forEach((k, i) => {
    const q = Math.min(1, Math.max(0, (t - 0.5 * i / p.n) / 0.5)), e = q * q * (3 - 2 * q);
    if (q > 0) out += `<use href="#keg" x="${(k.x - KEG_W / 2).toFixed(1)}" y="${(T - KEG_H + (k.y - T + KEG_H) * e).toFixed(1)}"/>`;
  });
  if (t >= 1 && p.values.length) {
    const x = sx(stats(p.values).m);
    out += `<line x1="${x}" y1="${B}" x2="${x}" y2="${T + 18}" stroke="#CD5909" stroke-width="2.5"/>
      <text x="${x}" y="${T + 12}" text-anchor="middle" font-size="18" fill="#CD5909" style="text-decoration:overline">X</text>`;
  }
  $('plot' + p.i).innerHTML = out;
}

function showStats(p) {
  const empty = !p.values.length, s = empty ? null : stats(p.values);
  $('xbar' + p.i).textContent = empty ? '—' : s.m.toFixed(1);
  $('sd' + p.i).textContent = empty ? '—' : s.s.toFixed(1);
}

$('draw').addEventListener('click', () => {
  cancelAnimationFrame(anim);
  samples.forEach(p => {
    p.values = Array.from({ length: p.n }, () => MU + SIGMA * randn());
  });
  const t0 = performance.now();
  const step = now => {
    const t = Math.min(1, (now - t0) / 1200);
    samples.forEach(p => render(p, t));
    if (t < 1) anim = requestAnimationFrame(step);
    else samples.forEach(showStats);
  };
  anim = requestAnimationFrame(step);
});
$('reset').addEventListener('click', () => {
  cancelAnimationFrame(anim);
  samples.forEach(p => { p.values = []; showStats(p); render(p, 1); });
});
samples.forEach(p => render(p, 1));
</script>
