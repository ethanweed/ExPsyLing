<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Independent Samples t-test</title>
<style>
  :root { --text:#4c4f69; --mantle:#e6e9ef; --border:#acb0be; --accent:#CD5909; --teal:#4C827B; }
  body { margin:0; padding:12px 16px; font-family:"Source Serif 4", Georgia, serif; color:var(--text); background:#fff; box-sizing:border-box; }
  .demo { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .side { min-width:0; display:flex; flex-direction:column; }
  svg { width:100%; height:auto; display:block; }
  .title { font-size:16px; font-weight:600; color:var(--teal); margin-bottom:4px; }
  .head { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .toggle { display:flex; flex:none; }
  .toggle button { font:inherit; font-size:14px; padding:2px 10px; color:var(--accent); background:#fff; border:1px solid var(--accent); cursor:pointer; }
  .toggle button:first-child { border-radius:6px 0 0 6px; border-right:none; }
  .toggle button:last-child { border-radius:0 6px 6px 0; }
  .toggle button[aria-pressed="true"] { color:#fff; background:var(--accent); }
  .panels { display:flex; gap:12px; margin-top:6px; flex:1; }
  .panel { flex:1; min-width:0; background:var(--mantle); border:1px solid var(--border); border-radius:8px; padding:6px 10px; }
  .label { font-size:13px; text-transform:uppercase; letter-spacing:.05em; font-weight:600; margin-bottom:2px; }
  .row { display:flex; align-items:center; gap:8px; margin:3px 0; font-size:16px; }
  .row label { width:18px; }
  .row input { flex:1; min-width:0; }
  .row span { width:32px; text-align:right; font-variant-numeric:tabular-nums; }
  #a .label { color:var(--teal); } #a input { accent-color:var(--teal); }
  #b .label { color:var(--accent); } #b input { accent-color:var(--accent); }
  .xbar { font-style:italic; border-top:1px solid currentColor; line-height:1.1; }
  .steps { display:grid; grid-template-columns:auto 1fr; gap:6px 8px; align-items:center; justify-items:start; font-size:18px; }
  .result { margin-top:7px; font-family:"JetBrains Mono","Fira Code",monospace; font-size:13.5px; line-height:1.4; }
  .result b { color:var(--accent); }
  .side:first-child .panels { flex:none; }
  .benchmark { margin-top:4px; font-size:13.5px; line-height:1.25; }
  .benchmark b { color:var(--accent); }
  .effect { flex:none; margin-top:8px; }
  .effect .label { color:var(--accent); margin-bottom:4px; text-transform:none; letter-spacing:0; font-size:14px; }
  @media (max-width:640px) { .demo { grid-template-columns:1fr; } }
  .cups { display:flex; justify-content:center; gap:14px; margin-top:16px; }
  .cups img { height:32px; width:auto; display:block; }
</style>
</head>
<body>
<div class="demo">
  <div class="side">
    <div class="title">Uncertainty about each mean (width: SE = s / √n)</div>
    <svg id="groupPlot" viewBox="0 0 500 215" role="img" aria-label="Scaled t distributions for the two group means"></svg>
    <div class="panels">
      <div class="panel" id="a"><div class="label">Group A</div>
        <div class="row"><label for="ma" class="xbar">X</label><input id="ma" type="range" min="60" max="140" value="95"><span id="mav"></span></div>
        <div class="row"><label for="sa"><i>s</i></label><input id="sa" type="range" min="5" max="30" value="12"><span id="sav"></span></div>
        <div class="row"><label for="na"><i>n</i></label><input id="na" type="range" min="2" max="30" value="10"><span id="nav"></span></div>
      </div>
      <div class="panel" id="b"><div class="label">Group B</div>
        <div class="row"><label for="mb" class="xbar">X</label><input id="mb" type="range" min="60" max="140" value="110"><span id="mbv"></span></div>
        <div class="row"><label for="sb"><i>s</i></label><input id="sb" type="range" min="5" max="30" value="12"><span id="sbv"></span></div>
        <div class="row"><label for="nb"><i>n</i></label><input id="nb" type="range" min="2" max="30" value="10"><span id="nbv"></span></div>
      </div>
    </div>
    <div class="panel effect"><div class="label">Effect size: Cohen's d</div><div class="steps" id="effect"></div>
      <div class="benchmark"><b id="size"></b> by Cohen's rough benchmarks (0.2 small, 0.5 medium, 0.8 large), only suggested for when domain knowledge is lacking</div>
    </div>
  </div>
  <div class="side">
    <div class="head">
      <div class="title" id="testTitle"></div>
      <div class="toggle"><button id="student" type="button">Student's</button><button id="welch" type="button">Welch's</button></div>
    </div>
    <svg id="testPlot" viewBox="0 0 500 215" role="img" aria-label="Null t distribution with the observed t statistic"></svg>
    <div class="panels"><div class="panel readout" id="readout"></div></div>
  </div>
</div>
<div class="cups" id="cups"></div>

const $ = id => document.getElementById(id);
const L = 15, R = 485, B = 180, T = 34;

// Lanczos approximation of log Γ
function logGamma(z) {
  const c = [76.18009172947146, -86.50532032941677, 24.01409824083091, -1.231739572450155, 0.1208650973866179e-2, -0.5395239384953e-5];
  let y = z, tmp = z + 5.5, ser = 1.000000000190015;
  tmp -= (z + 0.5) * Math.log(tmp);
  for (const k of c) ser += k / ++y;
  return -tmp + Math.log(2.5066282746310005 * ser / z);
}
const tPdf = (t, v) => Math.exp(logGamma((v + 1) / 2) - logGamma(v / 2)) / Math.sqrt(v * Math.PI) * (1 + t * t / v) ** (-(v + 1) / 2);

// regularized incomplete beta function (continued fraction)
function betaCf(x, a, b) {
  let c = 1, d = 1 - (a + b) * x / (a + 1);
  d = 1 / (Math.abs(d) < 1e-30 ? 1e-30 : d);
  let h = d;
  for (let m = 1; m <= 300; m++) {
    for (const aa of [m * (b - m) * x / ((a + 2 * m - 1) * (a + 2 * m)), -(a + m) * (a + b + m) * x / ((a + 2 * m) * (a + 2 * m + 1))]) {
      d = 1 + aa * d; d = 1 / (Math.abs(d) < 1e-30 ? 1e-30 : d);
      c = 1 + aa / c; if (Math.abs(c) < 1e-30) c = 1e-30;
      h *= d * c;
    }
  }
  return h;
}
function betaInc(x, a, b) {
  if (x <= 0) return 0;
  if (x >= 1) return 1;
  const front = Math.exp(logGamma(a + b) - logGamma(a) - logGamma(b) + a * Math.log(x) + b * Math.log(1 - x));
  return x < (a + 1) / (a + b + 2) ? front * betaCf(x, a, b) / a : 1 - front * betaCf(1 - x, b, a) / b;
}
const twoTailP = (t, v) => betaInc(v / (v + t * t), v / 2, 0.5);
function tCrit(v, alpha) {
  let lo = 0, hi = 100;
  for (let i = 0; i < 60; i++) { const mid = (lo + hi) / 2; if (twoTailP(mid, v) > alpha) lo = mid; else hi = mid; }
  return (lo + hi) / 2;
}

// Student's test: equal population variances, pooled SD, B − A
function studentTest(ma, sa, na, mb, sb, nb) {
  const df = na + nb - 2;
  const sp = Math.sqrt(((na - 1) * sa * sa + (nb - 1) * sb * sb) / df);
  const se = sp * Math.sqrt(1 / na + 1 / nb);
  const t = (mb - ma) / se;
  return { df, sp, se, t, p: twoTailP(t, df), crit: tCrit(df, 0.05) };
}

function welchTest(ma, sa, na, mb, sb, nb) {
  const va = sa * sa / na, vb = sb * sb / nb;
  const se = Math.sqrt(va + vb);
  const df = (va + vb) ** 2 / (va * va / (na - 1) + vb * vb / (nb - 1));
  const t = (mb - ma) / se;
  return { va, vb, df, se, t, p: twoTailP(t, df), crit: tCrit(df, 0.05) };
}
let welch = false;

const minus = s => String(s).replace('-', '−');
function drawGroups(ma, sa, na, mb, sb, nb) {
  const X0 = 40, X1 = 160, YMAX = 0.15;
  const sx = v => L + (v - X0) / (X1 - X0) * (R - L);
  // fixed y-scale; very narrow curves are cut off at the top of the plot
  const sy = d => B - Math.min(d, YMAX) / YMAX * (B - T);
  let out = '';
  for (const [m, s, n, color] of [[ma, sa, na, '#4C827B'], [mb, sb, nb, '#CD5909']]) {
    const se = s / Math.sqrt(n);
    const dens = x => tPdf((x - m) / se, n - 1) / se;
    let d = '';
    for (let x = X0; x <= X1 + 1e-9; x += 0.25) d += (d ? 'L' : 'M') + sx(x).toFixed(1) + ',' + sy(dens(x)).toFixed(1);
    out += `<path d="${d}L${sx(X1)},${B}L${sx(X0)},${B}Z" fill="${color}" fill-opacity="0.15"/>
      <path d="${d}" fill="none" stroke="${color}" stroke-width="2.5"/>
      <line x1="${sx(m)}" y1="${B}" x2="${sx(m)}" y2="${sy(dens(m))}" stroke="${color}" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  }
  // bracket showing the difference in means
  const mid = (sx(ma) + sx(mb)) / 2;
  out += `<line x1="${sx(ma)}" y1="24" x2="${sx(mb)}" y2="24" stroke="#4c4f69" stroke-width="1.5"/>
    <line x1="${sx(ma)}" y1="18" x2="${sx(ma)}" y2="30" stroke="#4c4f69" stroke-width="1.5"/>
    <line x1="${sx(mb)}" y1="18" x2="${sx(mb)}" y2="30" stroke="#4c4f69" stroke-width="1.5"/>
    <text x="${mid}" y="14" text-anchor="middle" font-size="15" fill="#4c4f69">B − A = ${minus(mb - ma)}</text>
    <line x1="${L}" y1="${B}" x2="${R}" y2="${B}" stroke="#acb0be"/>`;
  for (let t = 40; t <= 160; t += 20) out += `<text x="${sx(t)}" y="${B + 20}" text-anchor="middle" font-size="13" fill="#9ca0b0">${t}</text>`;
  $('groupPlot').innerHTML = out;
}

function drawTest(r) {
  const X0 = -6, X1 = 6, YMAX = 0.42;
  const sx = v => L + (v - X0) / (X1 - X0) * (R - L);
  const sy = d => B - d / YMAX * (B - T);
  const path = (a, b) => {
    let d = '';
    for (let x = a; x <= b + 1e-9; x += 0.05) d += (d ? 'L' : 'M') + sx(x).toFixed(1) + ',' + sy(tPdf(x, r.df)).toFixed(1);
    return d;
  };
  const area = (a, b) => `<path d="${path(a, b)}L${sx(b)},${B}L${sx(a)},${B}Z" fill="#CD5909" fill-opacity="0.45"/>`;
  const whole = path(X0, X1), abs = Math.abs(r.t);
  let out = `<path d="${whole}L${sx(X1)},${B}L${sx(X0)},${B}Z" fill="#4C827B" fill-opacity="0.15"/>`;
  // shaded tails are the p-value: as or more extreme than the observed t
  if (abs < X1) out += area(X0, -abs) + area(abs, X1);
  out += `<path d="${whole}" fill="none" stroke="#4C827B" stroke-width="2.5"/>`;
  // with very low Welch df the critical values fall off the axis
  if (r.crit < X1) for (const c of [-r.crit, r.crit]) out += `<line x1="${sx(c)}" y1="${B}" x2="${sx(c)}" y2="${T + 58}" stroke="#9ca0b0" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="${sx(c)}" y="${T + 52}" text-anchor="middle" font-size="14" fill="#9ca0b0">${minus(c.toFixed(2))}</text>`;
  const shown = Math.max(X0, Math.min(X1, r.t)), off = abs > X1;
  const anchor = shown > 3.5 ? 'end' : shown < -3.5 ? 'start' : 'middle';
  const text = `t = ${minus(r.t.toFixed(2))}${off ? (r.t > 0 ? ' →' : '') : ''}`;
  out += `<line x1="${sx(shown)}" y1="${B}" x2="${sx(shown)}" y2="${T}" stroke="#CD5909" stroke-width="2.5"/>
    <text x="${sx(shown)}" y="${T - 10}" text-anchor="${anchor}" font-size="18" fill="#CD5909">${off && r.t < 0 ? '← ' : ''}${text}</text>
    <line x1="${L}" y1="${B}" x2="${R}" y2="${B}" stroke="#acb0be"/>`;
  for (let t = X0; t <= X1; t += 2) out += `<text x="${sx(t)}" y="${B + 20}" text-anchor="middle" font-size="13" fill="#9ca0b0">${minus(t)}</text>`;
  $('testPlot').innerHTML = out;
}

// small MathML builders for the readout
const num = v => `<mn>${minus(v)}</mn>`;
const op = o => `<mo>${o}</mo>`;
const sub = (v, g) => `<msub><mi>${v}</mi><mi mathvariant="normal">${g}</mi></msub>`;
const sq = (v, g) => `<msubsup><mi>${v}</mi><mi mathvariant="normal">${g}</mi><mn>2</mn></msubsup>`;
const pow = v => `<msup><mn>${v}</mn><mn>2</mn></msup>`;
const frac = (a, b) => `<mfrac><mrow>${a}</mrow><mrow>${b}</mrow></mfrac>`;
const root = a => `<msqrt><mrow>${a}</mrow></msqrt>`;
const paren = a => `<mrow><mo>(</mo>${a}<mo>)</mo></mrow>`;
const xbar = g => `<msub><mover accent="true"><mi>X</mi><mo>‾</mo></mover><mi mathvariant="normal">${g}</mi></msub>`;

function sizeLabel(d) {
  const abs = Math.abs(d);
  return abs >= 0.8 ? 'Large' : abs >= 0.5 ? 'Medium' : abs >= 0.2 ? 'Small' : 'Tiny';
}

function draw() {
  const [ma, sa, na, mb, sb, nb] = ['ma', 'sa', 'na', 'mb', 'sb', 'nb'].map(id => {
    $(id + 'v').textContent = $(id).value;
    return +$(id).value;
  });
  const r = (welch ? welchTest : studentTest)(ma, sa, na, mb, sb, nb);
  drawGroups(ma, sa, na, mb, sb, nb);
  drawTest(r);
  $('testTitle').textContent = `Null distribution: t(${welch ? r.df.toFixed(2) : r.df})`;
  const p = r.p < 0.001 ? 'p < .001' : 'p = ' + r.p.toFixed(3).replace(/^0/, '');
  const verdict = `${r.p < 0.05 ? 'significant' : 'not significant'} at α = .05`;
  const se = num(r.se.toFixed(2));
  const tRow = [frac(xbar('B') + op('−') + xbar('A'), '<mi>SE</mi>'),
    frac(num(mb) + op('−') + num(ma), se) + op('=') + `<mn mathcolor="#CD5909">${minus(r.t.toFixed(2))}</mn>`];
  const rows = [];
  if (welch) {
    const va = num(r.va.toFixed(2)), vb = num(r.vb.toFixed(2));
    const termA = frac(sq('s', 'A'), sub('n', 'A')), termB = frac(sq('s', 'B'), sub('n', 'B'));
    rows.push(['<mi>SE</mi>', root(termA + op('+') + termB),
      root(frac(pow(sa), num(na)) + op('+') + frac(pow(sb), num(nb))) + op('=') + se]);
    rows.push(['<mi>t</mi>', ...tRow]);
    rows.push(['<mi>df</mi>',
      frac(`<msup>${paren(termA + op('+') + termB)}<mn>2</mn></msup>`, frac(`<msup>${paren(termA)}<mn>2</mn></msup>`, sub('n', 'A') + op('−') + num(1)) + op('+') + frac(`<msup>${paren(termB)}<mn>2</mn></msup>`, sub('n', 'B') + op('−') + num(1))),
      frac(`<msup>${paren(va + op('+') + vb)}<mn>2</mn></msup>`, frac(`<msup>${va}<mn>2</mn></msup>`, num(na - 1)) + op('+') + frac(`<msup>${vb}<mn>2</mn></msup>`, num(nb - 1))) + op('=') + num(r.df.toFixed(2))]);
  } else {
    const sp = num(r.sp.toFixed(2));
    const nm1 = g => sub('n', g) + op('−') + num(1);
    rows.push(['<msub><mi>s</mi><mtext>pooled</mtext></msub>',
      root(frac(paren(nm1('A')) + sq('s', 'A') + op('+') + paren(nm1('B')) + sq('s', 'B'), sub('n', 'A') + op('+') + sub('n', 'B') + op('−') + num(2))),
      root(frac(num(na - 1) + op('×') + pow(sa) + op('+') + num(nb - 1) + op('×') + pow(sb), num(r.df))) + op('=') + sp]);
    rows.push(['<mi>SE</mi>', '<msub><mi>s</mi><mtext>pooled</mtext></msub>' + root(frac(num(1), sub('n', 'A')) + op('+') + frac(num(1), sub('n', 'B'))),
      sp + op('×') + root(frac(num(1), num(na)) + op('+') + frac(num(1), num(nb))) + op('=') + se]);
    rows.push(['<mi>t</mi>', ...tRow]);
    rows.push(['<mi>df</mi>', sub('n', 'A') + op('+') + sub('n', 'B') + op('−') + num(2),
      num(na) + op('+') + num(nb) + op('−') + num(2) + op('=') + num(r.df)]);
  }
  // Student's: the test's pooled SD; Welch's: no weighting by n, so the SD doesn't assume equal variances
  const diff = frac(xbar('B') + op('−') + xbar('A'), '<mi>SD</mi>');
  const sdSym = welch ? root(frac(sq('s', 'A') + op('+') + sq('s', 'B'), num(2)))
    : '<msub><mi>s</mi><mtext>pooled</mtext></msub>';
  const sdVal = welch ? Math.sqrt((sa * sa + sb * sb) / 2) : r.sp;
  const sdCalc = welch ? root(frac(pow(sa) + op('+') + pow(sb), num(2))) + op('=') + num(sdVal.toFixed(2))
    : num(r.sp.toFixed(2));
  $('effect').innerHTML = `<math><mi>SD</mi>${op('=')}${sdSym}</math><math>${op('=')}${sdCalc}</math>
    <math><mi>d</mi>${op('=')}${diff}</math><math>${op('=')}${frac(num(mb) + op('−') + num(ma), num(sdVal.toFixed(2)))}${op('=')}<mn mathcolor="#CD5909">${minus(((mb - ma) / sdVal).toFixed(2))}</mn></math>`;
  $('size').textContent = sizeLabel((mb - ma) / sdVal);
  $('readout').innerHTML = `<div class="steps">${rows.map(([name, formula, values]) =>
    {
      // s_pooled is too long for two columns: its values go on their own line
      const span = name.includes('pooled') ? ' style="grid-column:1/-1"' : '';
      return `<math${span}>${name}${op('=')}${formula}</math><math${span}>${op('=')}${values}</math>`;
    }).join('')}</div>
    <div class="result"><b>${p}</b> (two-tailed); critical t = ±${r.crit.toFixed(2)}<br>${verdict}</div>`;
}
['ma', 'sa', 'na', 'mb', 'sb', 'nb'].forEach(id => $(id).addEventListener('input', draw));
function setTest(useWelch) {
  welch = useWelch;
  $('student').setAttribute('aria-pressed', !welch);
  $('welch').setAttribute('aria-pressed', welch);
  draw();
}
$('student').addEventListener('click', () => setTest(false));
$('welch').addEventListener('click', () => setTest(true));
setTest(false);
</script>
</body>
</html>
